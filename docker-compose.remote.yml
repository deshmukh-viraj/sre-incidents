services:
  prom-tunnel:
    image: alpine:3.20
    command: >
      sh -c "apk add --no-cache openssh-client &&
      ssh -N -i /key/aws-sandbox.pem
      -o StrictHostKeyChecking=accept-new
      -o ServerAliveInterval=30
      -o ExitOnForwardFailure=yes
      -L 0.0.0.0:9090:localhost:9090 ubuntu@${VM_IP}"
    volumes:
      - ${HOME}/.ssh/aws-sandbox.pem:/key/aws-sandbox.pem:ro

  # aws-tunnel: adds the forwards prom-tunnel does not provide:
  # 1) reverse forward: AWS Prometheus -> here -> alertmanager:9093
  # 2) admin bridge: agent's set_feature_flag writes the demo flag file on AWS
  # 3) browser forward: WSL -> AWS Prometheus UI
  # 4) logs backend: WSL/agent -> otel-demo OpenSearch (port discovered at boot)
  # 5) knowledge-graph: agent -> VM's neo4j (in-network only)
  aws-tunnel:
    image: alpine:3.20
    command: >
      sh -c "apk add --no-cache openssh-client python3;
      (ADMIN_PORT=${AWS_ADMIN_PORT} VM_IP=${VM_IP} SSH_TARGET=ubuntu@${VM_IP} SSH_KEY=/key/aws-sandbox.pem python3 /admin/admin_server.py) &
      OP=$$(python3 /admin/discover_opensearch_port.py 2>/dev/null || echo 32775);
      echo \"[aws-tunnel] opensearch host-published port: $$OP\";
      GF=32787;
      echo \"[aws-tunnel] grafana host-published port: $$GF (hardcoded; bump after AWS stack restart)\";
      ssh -i /key/aws-sandbox.pem -o StrictHostKeyChecking=accept-new ubuntu@${VM_IP} \"sudo fuser -k ${AWS_ALERT_RTNL_PORT}/tcp || true\";
      ssh -N -i /key/aws-sandbox.pem
      -o StrictHostKeyChecking=accept-new
      -o ServerAliveInterval=30
      -o ExitOnForwardFailure=yes
      -L 0.0.0.0:${REMOTE_PROM_UI_PORT}:localhost:9090
      -L 0.0.0.0:${OPENSEARCH_FWD_PORT:-9200}:localhost:$$OP
      -L 0.0.0.0:7687:localhost:7687
      -R ${AWS_ALERT_RTNL_HOST}:${AWS_ALERT_RTNL_PORT}:alertmanager:9093
      ubuntu@${VM_IP}"
    volumes:
      - ${HOME}/.ssh/aws-sandbox.pem:/key/aws-sandbox.pem:ro
      - ./aws-admin/admin_server.py:/admin/admin_server.py:ro
      - ./aws-admin/discover_opensearch_port.py:/admin/discover_opensearch_port.py:ro
  
    ports:
      - "127.0.0.1:${REMOTE_PROM_UI_PORT}:${REMOTE_PROM_UI_PORT}"
      # WSL access to the demo OpenSearch (agent queries it in-docker as
      # http://aws-tunnel:${OPENSEARCH_FWD_PORT:-9200}); 9299 avoids WSL clashes
      - "127.0.0.1:9299:${OPENSEARCH_FWD_PORT:-9200}"

  agent:
    environment:
      - PROMETHEUS_URL=http://prom-tunnel:9090
      - DRY_RUN=0
      # logs backend for log_tool/query_service_logs/query_traces: the active
      # target is the AWS otel-demo -> opensearch via the tunnel. Set
      # LOG_BACKEND=loki (in .env or host env) to investigate the local simulator.

      - LOG_BACKEND=${LOG_BACKEND:-opensearch}
      - LOG_OPENSEARCH_URL=http://aws-tunnel:${OPENSEARCH_FWD_PORT:-9200}
      - NEO4J_URI=bolt://aws-tunnel:7687
      - NEO4J_USERNAME=${NEO4J_REMOTE_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_REMOTE_PASSWORD}

